services:
  # gpt4free service — provides the upstream AI API
  g4f:
    image: hlohaus789/g4f:latest
    container_name: g4f_service
    restart: unless-stopped
    shm_size: 2g
    ports:
      - "8080:8080"
    networks:
      - router_net

  # n8n-g4f-router — the smart failover proxy
  router:
    container_name: n8n_g4f_router
    build: .
    restart: unless-stopped
    ports:
      - "${ROUTER_PORT:-3000}:3000"
    env_file: .env
    environment:
      - G4F_UPSTREAM_URL=http://g4f:8080
    depends_on:
      - g4f
    networks:
      - router_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  router_net:
    driver: bridge